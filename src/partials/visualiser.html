<div class="vis" data-vis>
  <div class="vis__stage" data-vis-stage>
    <canvas class="vis__photo" data-vis-photo aria-hidden="true"></canvas>
    <div class="vis__lamp" aria-hidden="true"></div>
    <div class="vis__plane" data-vis-plane aria-hidden="true"><div class="vis__trough" data-vis-trough></div><canvas></canvas></div>
    <svg class="vis__svg" aria-hidden="true"><polygon data-vis-line></polygon></svg>
    <button class="vis__corner" type="button" data-corner aria-label="Top left corner. Move with the arrow keys"></button>
    <button class="vis__corner" type="button" data-corner aria-label="Top right corner. Move with the arrow keys"></button>
    <button class="vis__corner" type="button" data-corner aria-label="Bottom right corner. Move with the arrow keys"></button>
    <button class="vis__corner" type="button" data-corner aria-label="Bottom left corner. Move with the arrow keys"></button>
    <div class="vis__tools"><button type="button" data-vis-evening aria-pressed="false">Evening</button><button type="button" data-vis-bare>Hold to compare</button><button type="button" data-vis-save>Save picture</button></div>
    <div class="vis__wait"><svg class="mark lg lg-wait" viewBox="0 0 768 571" aria-label="Loading" role="img">{{> mark-paths}}</svg></div>
  </div>
  <div class="vis__panel">
    <div class="vis__src">
      <label class="btn btn--lime"><input class="vh" type="file" accept="image/*" capture="environment" data-vis-file>Photograph your wall</label>
      <label class="link vis__pick"><input class="vh" type="file" accept="image/*" data-vis-file>Choose a photo</label>
    </div>
    <div class="vis__opts">
      <div class="vis__dim"><span>Width</span><button class="step" type="button" data-vis-step="cols,-1" aria-label="Narrower">−</button><button class="step" type="button" data-vis-step="cols,1" aria-label="Wider">+</button></div>
      <div class="vis__dim"><span>Height</span><button class="step" type="button" data-vis-step="rows,-1" aria-label="Lower">−</button><button class="step" type="button" data-vis-step="rows,1" aria-label="Taller">+</button></div>
      <div class="vis__plants">
        <div class="seg" role="group" aria-label="Where the wall is"><button type="button" data-vis-place="in" aria-pressed="true">Interior plants</button><button type="button" data-vis-place="ex" aria-pressed="false">Exterior plants</button></div>
        <fieldset class="vis__style"><legend class="vh">Planting</legend>
          <label data-area="in"><input type="radio" name="planting" value="1" data-vis-style><span>Morning</span></label>
          <label data-area="in"><input type="radio" name="planting" value="0" checked data-vis-style><span>Midday</span></label>
          <label data-area="in"><input type="radio" name="planting" value="2" data-vis-style><span>Evening</span></label>
          <label data-area="ex" hidden><input type="radio" name="planting" value="3" data-vis-style><span>Morning</span></label>
          <label data-area="ex" hidden><input type="radio" name="planting" value="4" data-vis-style><span>Midday</span></label>
          <label data-area="ex" hidden><input type="radio" name="planting" value="5" data-vis-style><span>Evening</span></label>
        </fieldset>
      </div>
    </div>
    <div class="vis__end"><p role="status"><span data-vis-out></span> <span class="vis__area" data-vis-area></span></p><a class="btn btn--line" data-vis-cta href="/get-a-quote.html">Commission this wall</a></div>
    <p class="vis__msg" role="alert" data-vis-msg></p>
  </div>
</div>
